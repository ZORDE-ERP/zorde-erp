name: CI Zorde Labs API

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'apps/api/zorde-erp-laboratorio/**'
      - 'packages/**'
      - 'turbo.json'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'apps/api/zorde-erp-laboratorio/**'
      - 'packages/**'
      - 'turbo.json'
      - '.github/workflows/ci-api.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fake:fake@localhost:5432/ci_db
      JWT_SECRET: ci-test-secret-not-real
      APP_ENV: test
      JWT_SECRET_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      RESEND_API_KEY: re_fake_key
      SALT_ROUNDS_BCRYPT: 1
      SERVER_URL: http://localhost:3000
      API_PORT: 3000
      POSTGRES_DB: ci_db
      POSTGRES_USER: fake
      POSTGRES_PASSWORD: fake

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api/zorde-erp-laboratorio

      - name: CI checks
        run: >
          npx turbo run lint:check check-types test:cov build
          --filter=zorde-erp
          --cache-dir=.turbo
