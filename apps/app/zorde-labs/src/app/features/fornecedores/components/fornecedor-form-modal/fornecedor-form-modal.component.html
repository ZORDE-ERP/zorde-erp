<app-modal
  [open]="open()"
  [title]="title()"
  size="lg"
  confirmLabel="Salvar"
  [confirmLoading]="saving()"
  (closed)="onClose()"
  (confirmed)="onSubmit()"
>
  <div class="flex flex-col gap-stack-lg">
    <app-tabs [tabs]="tabs()" [(activeTab)]="activeTab" />

    @if (activeTab() === 'dados' || activeTab() === 'endereco') {
      <app-pessoa-form
        [(value)]="value"
        [section]="activeTab() === 'endereco' ? 'endereco' : 'dados'"
      />
    }
  </div>
</app-modal>
