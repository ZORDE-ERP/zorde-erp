<section class="flex w-full flex-col gap-stack-xl">
  <app-page-header title="Fornecedores" description="Gerencie os fornecedores cadastrados no laboratório.">
    <button app-button type="button" class="w-full sm:w-auto" (click)="onCreate()">
      <svg lucidePlus class="h-4 w-4" aria-hidden="true"></svg>
      Novo Fornecedor
    </button>
  </app-page-header>

  <app-summary-cards [items]="summaryItems()" (cardClick)="onSummaryClick($event)" />

  <app-fornecedor-filtro [filterExpanded]="false" (onClearFilter)="onClearFilter()" [filtroForm]="filtroForm" />

  <section aria-labelledby="fornecedores-lista-heading" class="min-w-0">
    <h2 id="fornecedores-lista-heading" class="sr-only">Fornecedores cadastrados</h2>
    <article app-card class="min-h-80">
      <div app-card-body class="min-w-0">
        <app-fornecedores-table [rows]="filteredFornecedores()" [loading]="loading()" (actionTriggered)="onRowAction($event)" />
      </div>
    </article>
  </section>
</section>

<app-fornecedor-form-modal
  [open]="modalOpen()"
  [title]="modalTitle()"
  [saving]="saving()"
  [fornecedorId]="editingFornecedor()?.id ?? null"
  [(value)]="formValue"
  (closed)="onModalClosed()"
  (submitted)="onModalSubmit()"
/>
