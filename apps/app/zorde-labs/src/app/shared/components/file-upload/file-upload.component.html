<div class="flex flex-col gap-3">
  <div class="flex items-center justify-between gap-2">
    <p class="text-sm font-medium text-text-primary">{{ label() }}</p>
    @if (loading()) {
      <span class="inline-flex items-center gap-2 text-xs text-text-muted">
        <app-spinner size="sm" label="Enviando imagem" />
        Enviando…
      </span>
    }
  </div>

  <div
    class="flex flex-col items-center justify-center gap-4 rounded-sm-sm border border-dashed border-border bg-surface-muted/40 px-4 py-6 sm:flex-row sm:justify-start"
  >
    @if (displayPreview(); as preview) {
      <img [src]="preview" [alt]="label()" class="h-24 w-24 rounded-sm-md object-cover" />
    } @else {
      <div
        class="flex h-24 w-24 items-center justify-center rounded-sm-md bg-surface-elevated text-text-muted"
        aria-hidden="true"
      >
        <svg lucideIcon="image-plus" class="h-8 w-8"></svg>
      </div>
    }

    <div class="flex flex-col items-center gap-2 sm:items-start">
      <p class="text-sm text-text-secondary">JPEG, PNG, WebP ou SVG até 2MB</p>
      <div class="flex flex-wrap items-center gap-2">
        <button
          app-button
          type="button"
          size="sm"
          [isDisabled]="disabled() || loading()"
          (click)="openPicker()"
        >
          <svg lucideIcon="upload" class="h-4 w-4" aria-hidden="true"></svg>
          Escolher arquivo
        </button>
        @if (displayPreview()) {
          <button
            app-icon-button
            type="button"
            label="Remover imagem"
            [isDisabled]="disabled() || loading()"
            (click)="clear()"
          >
            <svg lucideIcon="trash-2" class="h-4 w-4" aria-hidden="true"></svg>
          </button>
        }
      </div>
    </div>
  </div>

  <input
    #fileInput
    type="file"
    class="sr-only"
    [accept]="accept()"
    [disabled]="disabled() || loading()"
    (change)="onFileChange($event)"
  />
</div>
