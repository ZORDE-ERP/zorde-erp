<article app-card class="w-full">
	<header
		app-card-header
		class="flex cursor-pointer flex-row items-start justify-between gap-3 motion-safe:transition-colors hover:bg-surface-muted/50"
		(click)="toggle()"
	>
		<div class="flex min-w-0 items-start gap-3">
			<span
				class="mt-0.5 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-sm bg-surface-muted text-text-muted"
				aria-hidden="true"
			>
				<svg lucideFilter class="h-4 w-4"></svg>
			</span>
			<div class="min-w-0">
				<h2 app-card-title>{{ title() }}</h2>
				@if (description()) {
					<p app-card-description>{{ description() }}</p>
				}
			</div>
		</div>

		<button
			app-icon-button
			type="button"
			class="shrink-0"
			[label]="expanded() ? 'Recolher filtros' : 'Expandir filtros'"
			[attr.aria-expanded]="expanded()"
			(click)="$event.stopPropagation(); toggle()"
		>
			@if (expanded()) {
				<svg lucideChevronUp class="h-4 w-4" aria-hidden="true"></svg>
			} @else {
				<svg lucideChevronDown class="h-4 w-4" aria-hidden="true"></svg>
			}
		</button>
	</header>

	@if (expanded()) {
		<div app-card-body class="flex flex-col gap-stack-lg">
			<div
				class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 [&_form]:contents"
			>
				<ng-content />
			</div>

			<footer class="flex justify-end border-t border-border pt-4">
				<button app-button variant="outline" type="button" size="sm" (click)="onClear()">
					{{ clearLabel() }}
				</button>
			</footer>
		</div>
	}
</article>
