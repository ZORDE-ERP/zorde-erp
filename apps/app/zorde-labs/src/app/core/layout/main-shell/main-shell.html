<app-layout
	brand="Zorde Labs"
	brandSubtitle="Gestão laboratorial"
	[navbarTitle]="navbarTitle()"
	[navbarSubtitle]="navbarSubtitle()"
	[primaryItems]="primaryItems"
	[groups]="groups"
	[user]="user()"
	[sidebarOpen]="sidebarOpen()"
	[sidebarCollapsed]="sidebarCollapsed()"
	(sidebarOpenChange)="onSidebarOpenChange($event)"
	(sidebarCollapsedChange)="onSidebarCollapsedChange($event)"
	(profileRequested)="onProfile()"
	(logoutRequested)="onLogout()"
	(notificationsClicked)="onNotifications()"
>
	@if (navigating()) {
		<div class="mx-auto flex w-full max-w-leitura-larga flex-col gap-stack-lg" role="status" aria-label="Carregando página">
			<div class="w-2/5">
				<app-skeleton size="lg" />
			</div>
			<div class="flex flex-col gap-3">
				<app-skeleton />
				<div class="w-5/6">
					<app-skeleton />
				</div>
				<div class="w-2/3">
					<app-skeleton size="sm" />
				</div>
			</div>
			<span class="sr-only">Carregando conteúdo</span>
		</div>
	}
	<div class="min-h-full w-full" [class.hidden]="navigating()">
		<router-outlet />
	</div>
</app-layout>
