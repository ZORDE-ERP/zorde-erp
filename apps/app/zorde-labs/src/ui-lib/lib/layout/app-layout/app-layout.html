<div class="flex min-h-dvh bg-surface-muted text-text-primary">
	@if (sidebarOpen()) {
		<button
			class="fixed inset-0 z-backdrop bg-surface-inverse/40 lg:hidden"
			type="button"
			aria-label="Fechar menu"
			(click)="closeSidebar()"
		></button>
	}

	<app-sidebar
		[brand]="brand()"
		[brandSubtitle]="brandSubtitle()"
		[primaryItems]="primaryItems()"
		[groups]="groups()"
		[secondaryItems]="secondaryItems()"
		[footerItems]="footerItems()"
		[user]="user()"
		[collapsed]="sidebarCollapsed()"
		[mobileOpen]="sidebarOpen()"
		(collapseToggled)="toggleCollapsed()"
		(navigated)="closeSidebar()"
		(profileRequested)="onProfile()"
		(logoutRequested)="onLogout()"
	/>

	<div class="flex min-h-dvh min-w-0 flex-1 flex-col">
		<app-navbar
			[title]="navbarTitle()"
			[subtitle]="navbarSubtitle()"
			[notificationCount]="notificationCount()"
			[user]="user()"
			(menuToggled)="toggleSidebar()"
			(notificationsClicked)="onNotifications()"
			(profileRequested)="onProfile()"
			(logoutRequested)="onLogout()"
		/>

		<main class="flex-1 overflow-auto p-4 md:p-6 lg:p-8">
			<ng-content />
		</main>
	</div>

</div>
