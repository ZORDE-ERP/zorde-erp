<input
  type="text"
  role="combobox"
  aria-autocomplete="list"
  aria-haspopup="listbox"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  [attr.aria-expanded]="open()"
  [value]="displayValue()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  class="flex h-11 w-full rounded-sm-sm border border-border-strong bg-surface px-3 py-2 text-sm text-text-primary placeholder:text-text-muted motion-safe:transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-border-focus focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-surface-muted disabled:opacity-50"
  (click)="openList()"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
/>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="open() && !disabled()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayWidth]="overlayWidth()"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  cdkConnectedOverlayPanelClass="app-searchable-select-overlay"
  (overlayOutsideClick)="onOutsideClick($event)"
  (detach)="close()"
>
  <div
    role="listbox"
    class="max-h-60 w-full overflow-auto rounded-sm-sm border border-border bg-surface-elevated py-1 shadow-lg"
  >
    @if (filteredOptions().length === 0) {
      <div
        role="option"
        aria-disabled="true"
        class="flex w-full cursor-default items-center px-3 py-2 text-left text-sm text-text-muted"
      >
        {{ emptyMessage() }}
      </div>
    } @else {
      @for (option of filteredOptions(); track option.value) {
        <button
          type="button"
          role="option"
          [attr.aria-selected]="value() === option.value"
          class="flex w-full items-center px-3 py-2 text-left text-sm text-text-primary hover:bg-surface-muted"
          [class.bg-surface-muted]="value() === option.value"
          (mousedown)="$event.preventDefault()"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </button>
      }
    }
  </div>
</ng-template>
