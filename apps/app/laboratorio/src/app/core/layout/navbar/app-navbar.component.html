<header class="flex h-14 shrink-0 items-center gap-2 border-b border-border bg-card px-4 transition-[width,height] ease-linear">
  <!-- Sidebar Trigger -->
  <button hlmSidebarTrigger class="shrink-0" aria-label="Alternar menu lateral"></button>

  <!-- Separador vertical -->
  <div class="h-5 w-px bg-border"></div>

  <!-- Título / Breadcrumb placeholder -->
  <div class="flex flex-1 items-center gap-2">
    <span class="text-sm font-medium text-foreground">Zorde Gestão</span>
  </div>

  <!-- Ações à direita -->
  <div class="flex items-center gap-1">
    <!-- Notificações -->
    <button
      class="flex size-8 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      aria-label="Notificações"
    >
      <ng-icon hlm name="lucideBell" size="sm" />
    </button>

    <!-- Avatar / Perfil -->
    <button
      class="flex size-8 items-center justify-center rounded-full bg-primary text-primary-foreground text-xs font-semibold transition-colors hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
      aria-label="Perfil do usuário"
    >
      ZG
    </button>
  </div>
</header>
