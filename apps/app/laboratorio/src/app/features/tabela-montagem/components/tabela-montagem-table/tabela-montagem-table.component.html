<div class="rounded-md border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950">
  <table hlmTable class="w-full">
    <thead>
      <tr hlmTr>
        <th hlmTh class="w-1/3">Cliente</th>
        <th hlmTh class="w-1/4">Tipo de Serviço</th>
        <th hlmTh class="w-1/5">Valor</th>
        <th hlmTh class="w-[80px]">Ações</th>
      </tr>
    </thead>

    <tbody>
      @for (item of items(); track item.id) {
        <tr hlmTr>
          <td hlmTd class="font-medium">{{ item.nomeCliente }}</td>
          <td hlmTd>{{ item.servico }}</td>
          <td hlmTd>{{ formatCurrency(item.valor) }}</td>
          <td hlmTd>
            <button
              hlmBtn
              size="icon"
              variant="ghost"
              [hlmDropdownMenuTrigger]="menu"
            >
              <ng-icon name="lucideMoreHorizontal" hlm size="16px" />
            </button>

            <ng-template #menu>
              <div hlmDropdownMenu>
                <button hlmDropdownMenuItem (click)="onEdit(item)">
                  <ng-icon name="lucidePencil" hlm size="16px" class="mr-2" />
                  <span>Editar</span>
                </button>

                <div hlmDropdownMenuSeparator></div>

                <button hlmDropdownMenuItem (click)="onDelete(item.id)" class="text-red-600 focus:text-red-700">
                  <ng-icon name="lucideTrash" hlm size="16px" class="mr-2" />
                  <span>Excluir</span>
                </button>
              </div>
            </ng-template>
          </td>
        </tr>
      } @empty {
        <tr hlmTr>
          <td hlmTd colspan="4" class="text-center py-8 text-zinc-500">
            Nenhum registro encontrado.
          </td>
        </tr>
      }
    </tbody>
  </table>

  <hlm-numbered-pagination
    [(currentPage)]="_currentPage"
    [(itemsPerPage)]="_pageSize"
    [totalItems]="pagination().totalItems"
  />
</div>
