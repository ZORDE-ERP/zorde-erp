<div class="flex flex-col space-y-6">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Tabela Montagem</h1>
      <p class="text-zinc-500 dark:text-zinc-400">Gerencie os preços de serviços de montagem por cliente.</p>
    </div>
    <button hlmBtn (click)="onCreate()">
      <ng-icon name="lucidePlus" hlm size="16px" class="mr-2" />
      Adicionar
    </button>
  </div>

  <!-- Cards de totais -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div hlmCard>
      <div hlmCardHeader>
        <h4 hlmCardTitle class="flex items-center gap-2 text-sm font-medium">
          <ng-icon name="lucideList" hlm size="16px" />
          Total de Registros
        </h4>
      </div>
      <div hlmCardContent>
        <p class="text-2xl font-bold">{{ facade.total() }}</p>
      </div>
    </div>
  </div>

  <!-- Filtro -->
  <div class="flex items-center gap-2">
    <input
      hlmInput
      type="text"
      placeholder="Buscar por cliente ou tipo de serviço..."
      class="max-w-sm"
      (input)="onSearchChange($event)"
    />
  </div>

  <!-- Loading -->
  @if (facade.loading()) {
    <div class="flex justify-center py-8">
      <hlm-spinner />
    </div>
  }

  <!-- Erro -->
  @if (facade.error()) {
    <p class="text-sm text-red-500">{{ facade.error() }}</p>
  }

  <!-- Tabela -->
  @if (!facade.loading()) {
    <app-tabela-montagem-table
      [items]="facade.items()"
      [pagination]="{ currentPage: facade.currentPage(), pageSize: facade.pageSize(), totalItems: facade.total() }"
      (editItem)="onEdit($event)"
      (deleteItem)="onDelete($event)"
      (pageChanged)="onPageChange($event)"
      (pageSizeChanged)="onPageSizeChange($event)"
    />
  }

</div>
