<div class="flex flex-col gap-6 p-6">
  <!-- Page header -->
  <div>
    <h1 class="text-2xl font-bold font-heading text-foreground">Dashboard</h1>
    <p class="text-sm text-muted-foreground mt-1">Visão geral do faturamento e principais fechamentos do período</p>
  </div>

  <!-- Main grid: chart (wider) + ranking (sidebar) -->
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <!-- Billing chart — takes 2/3 on desktop -->
    <div class="lg:col-span-2">
      <app-billing-chart
        [chartData]="billingChartData()"
        [isLoading]="isBillingChartLoading()"
        [clients]="clients()"
        [selectedClientId]="selectedClientId()"
        [billingPeriod]="billingPeriod()"
        (clientSelected)="onClientSelected($event)"
        (periodToggled)="onPeriodToggled($event)"
      />
    </div>

    <!-- Closings ranking — takes 1/3 on desktop -->
    <div class="lg:col-span-1">
      <app-closings-ranking
        [items]="closingsRankingData()"
        [isLoading]="isRankingsLoading()"
        [monthOptions]="monthOptions()"
        [selectedMonth]="selectedRankingMonth()"
        (monthSelected)="onMonthSelected($event)"
      />
    </div>
  </div>
</div>
