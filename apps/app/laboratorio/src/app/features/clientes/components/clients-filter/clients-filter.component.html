<app-filter-card
  [isExpanded]="isExpanded()"
  (filterCleared)="onClear()"
  (toggleExpanded)="onToggle()">

  <form [formGroup]="form" (ngSubmit)="onSearch()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Busca -->
    <div class="space-y-2">
      <label hlmLabel for="search">Busca por Nome ou Documento</label>
      <input hlmInput id="search" formControlName="search" placeholder="Ex: João da Silva..." />
    </div>

    <!-- Tipo de Cliente -->
    <div class="space-y-2">
      <label hlmLabel>Tipo de Cliente</label>
      <hlm-select formControlName="type" placeholder="Selecione um tipo">
        <hlm-select-trigger>
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item value="">Todos</hlm-select-item>
          <hlm-select-item value="FISICA">Pessoa Física</hlm-select-item>
          <hlm-select-item value="JURIDICA">Pessoa Jurídica</hlm-select-item>
        </hlm-select-content>
      </hlm-select>
    </div>

    <!-- Status -->
    <div class="space-y-2">
      <label hlmLabel>Status</label>
      <hlm-select formControlName="status" placeholder="Selecione o status">
        <hlm-select-trigger>
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item value="">Todos</hlm-select-item>
          <hlm-select-item value="ACTIVE">Ativo</hlm-select-item>
          <hlm-select-item value="INACTIVE">Inativo</hlm-select-item>
        </hlm-select-content>
      </hlm-select>
    </div>

    <div class="col-span-1 md:col-span-3 flex justify-end">
      <button hlmBtn type="submit">Buscar Clientes</button>
    </div>
  </form>

</app-filter-card>
