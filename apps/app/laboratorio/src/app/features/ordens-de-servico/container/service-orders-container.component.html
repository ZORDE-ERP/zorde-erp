<div class="flex flex-col space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Ordens de Serviço</h1>
      <p class="text-zinc-500 dark:text-zinc-400">Gerencie as ordens de serviço do laboratório.</p>
    </div>

    <button hlmBtn (click)="onCreate()">
      <ng-icon name="lucidePlus" hlm size="16px" class="mr-2" />
      Adicionar
    </button>
  </div>

  <app-summary-cards [items]="(summaryItems$ | async) ?? []"></app-summary-cards>

  <app-service-orders-filter
    [isExpanded]="(facade.state.filterExpanded$ | async) ?? false"
    (filterChanged)="onFilterChanged($event)"
    (filterCleared)="onFilterCleared()"
    (toggleExpanded)="onToggleFilter()"
  ></app-service-orders-filter>

  <app-service-orders-list
    [orders]="(facade.state.orders$ | async) ?? []"
    [pagination]="(facade.state.pagination$ | async) ?? { currentPage: 1, pageSize: 10, totalItems: 0 }"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (pageChanged)="onPageChange($event)"
    (pageSizeChanged)="onPageSizeChange($event)"
  ></app-service-orders-list>
</div>
