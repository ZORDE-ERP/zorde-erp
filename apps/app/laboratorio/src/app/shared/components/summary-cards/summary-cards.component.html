<div class="grid gap-4 md:grid-cols-3">
  @for (item of items(); track item.title) {
    <div hlmCard>
      <div hlmCardHeader class="flex flex-row items-center justify-between pb-2 space-y-0">
        <h3 hlmCardTitle class="text-sm font-medium text-zinc-500 dark:text-zinc-400">{{ item.title }}</h3>
        @if (item.icon) {
          <ng-icon [name]="item.icon" hlm size="16px" class="text-zinc-500 dark:text-zinc-400" />
        }
      </div>
      <div hlmCardContent>
        <div class="text-2xl font-bold" [class]="{
          'text-emerald-600 dark:text-emerald-500': item.variant === 'success',
          'text-red-600 dark:text-red-500': item.variant === 'destructive'
        }">{{ item.value }}</div>
      </div>
    </div>
  }
</div>
