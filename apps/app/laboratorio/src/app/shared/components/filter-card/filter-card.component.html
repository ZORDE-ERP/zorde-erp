<section hlmCard class="w-full">
  <!-- Header / Toggle -->
  <div
    hlmCardHeader
    class="flex flex-row items-center justify-between p-4 cursor-pointer transition-colors hover:bg-zinc-50 dark:hover:bg-zinc-900"
    (click)="onToggle()">
    <div class="flex items-center space-x-2">
      <ng-icon name="lucideFilter" hlm size="20px" class="text-zinc-500 dark:text-zinc-400" />
      <h3 hlmCardTitle class="text-base font-medium">Filtros Avançados</h3>
    </div>

    <button hlmBtn variant="ghost" size="icon" class="w-8 h-8 rounded-full">
      @if (isExpanded()) {
        <ng-icon name="lucideChevronUp" hlm size="16px" />
      } @else {
        <ng-icon name="lucideChevronDown" hlm size="16px" />
      }
    </button>
  </div>

  <!-- Collapsible Content -->
  @if (isExpanded()) {
    <div class="px-4 pb-4 animate-in slide-in-from-top-2 fade-in duration-200">
      <div class="py-2">
        <ng-content></ng-content>
      </div>

      <div class="flex justify-end pt-4 mt-2 border-t border-zinc-100 dark:border-zinc-800">
        <button hlmBtn variant="outline" size="sm" (click)="onClearFilters()">
          Limpar Filtros
        </button>
      </div>
    </div>
  }
</section>
