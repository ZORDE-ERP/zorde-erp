<button
	class="inline-flex h-11 items-center rounded-sm border border-border-strong bg-surface px-3 text-sm font-medium text-text-primary hover:bg-surface-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-border-focus focus-visible:ring-offset-2"
	type="button"
	[attr.aria-expanded]="open()"
	aria-haspopup="dialog"
	(click)="toggle()"
>
	{{ label() }}
</button>

@if (open()) {
	<div
		class="absolute left-0 z-popover mt-2 w-72 rounded-lg border border-border bg-surface-elevated p-4 shadow-lg"
		role="dialog"
	>
		<ng-content />
	</div>
}
